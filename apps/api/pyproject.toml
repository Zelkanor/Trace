[project]
name = "api"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
