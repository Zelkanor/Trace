# Run with the app env files so ports and origins have a single source of truth:
#   docker compose --env-file apps/api/.env --env-file apps/web/.env up --build
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: apps/api/.env
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
    ports:
      - "${API_PORT:?}:${API_PORT:?}"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_HOST: ${NEXT_PUBLIC_API_HOST:?}
    environment:
      PORT: ${WEB_PORT:?}
    ports:
      - "${WEB_PORT:?}:${WEB_PORT:?}"
    depends_on:
      - api
    restart: unless-stopped
